name: Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "URL of the deployed Ai BLINE web app the APK will load"
        required: true
        default: "https://ai-bline.vercel.app"

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: bun install

      # Re-bakes capacitor.config.json into the Android project with the
      # server URL provided at dispatch time, then copies web assets.
      - name: Sync Capacitor Android platform
        env:
          AIBLINE_SERVER_URL: ${{ inputs.server_url }}
        run: bunx cap sync android

      - name: Generate launcher icons & splash
        run: bunx @capacitor/assets generate --android --iconBackgroundColor "#04060B" --splashBackgroundColor "#04060B"
        continue-on-error: true

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Ai-BLINE-v1.0.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ai-BLINE-debug-apk
          path: dist/Ai-BLINE-v1.0.0-debug.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: "Ai BLINE Android APK — build #${{ github.run_number }}"
          body: |
            ## 📱 Ai BLINE — Android debug build

            | | |
            |---|---|
            | **App ID** | `com.aibline.app` |
            | **Version** | 1.0.0 (versionCode 1) |
            | **Server URL** | `${{ inputs.server_url }}` |
            | **Type** | debug (signed with debug key — installable) |

            ### Install
            1. Download `Ai-BLINE-v1.0.0-debug.apk` below.
            2. On your phone, allow **Install unknown apps** for your browser/file manager.
            3. Open the APK and install.

            > ℹ️ This APK is a native WebView shell that loads the deployed
            > Ai BLINE web app at the URL above. If the URL isn't live yet,
            > the app shows its built-in setup screen.
          files: dist/Ai-BLINE-v1.0.0-debug.apk
          make_latest: true
